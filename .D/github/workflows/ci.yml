name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec tsc --noEmit

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Prisma generate
        run: pnpm prisma generate --schema nextjs-setup/nextjs-dashboard/prisma/schema.prisma

      - name: Migration validation
        run: pnpm prisma migrate diff --from python --to python --preview-apply

      - name: Unit tests
        run: pnpm exec pytest -q

      - name: Integration tests
        run: pnpm exec pytest -q --integration

      - name: Next.js production build
        run: pnpm --dir nextjs-setup/nextjs-dashboard build

      - name: Python tests
        run: python -m pytest -q

  # Vercel deployment verification
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Vercel preview deployment
        run: vercel --prod --token ${{ secrets.VERCEL_TOKEN }}

      - name: Smoke tests
        run: |
          curl -s https://your-domain.com/ | grep -q "SMMAI" && echo "Home OK"
          curl -s https://your-domain.com/api/health | grep -q "ok" && echo "Health OK"