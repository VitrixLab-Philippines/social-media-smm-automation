name: Daily SMM Dry Run

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: "true"
      AI_PROVIDER: "stub"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Generate daily draft
        run: python -m smm.cli "daily social content idea"
