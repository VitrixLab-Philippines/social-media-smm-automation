<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Automation - WASM Migration</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SMM Automation</h1>
            <p>AI-assisted social media management with human approval gates</p>
        </header>

        <main>
            <section id="engagement-rate" class="card">
                <h2>Engagement Rate Calculator</h2>
                <div class="form-group">
                    <label>Impressions</label>
                    <input type="number" id="imp" min="0" value="1000">
                    <label>Engagements</label>
                    <input type="number" id="eng" min="0" value="50">
                </div>
                <button class="btn" onclick="computeEngagementRate()">Compute</button>
                <div class="result">Engagement Rate: <span id="rate-value">loading...</span></div>
            </section>

            <section id="rank-signals" class="card">
                <h2>Rank Signals</h2>
                <div class="form-group">
                    <label>Signals (JSON array)</label>
                    <textarea id="signals-json" rows="3">[{"topic":"social","source":"api","relevance":0.8},{"topic":"tech","source":"web","relevance":0.95}]</textarea>
                </div>
                <button class="btn" onclick="computeRankSignals()">Compute</button>
                <div class="result">Sorted Signals: <span id="sorted-value">loading...</span></div>
            </section>
        </main>
    </div>

    <script>
        let engagementRateModule = null;
        let rankSignalsModule = null;

        async function loadWasmModules() {
            engagementRateModule = await WebAssembly.instantiate(
                await fetch('/wasm/engagement_rate.wasm').then(r => r.arrayBuffer())
            );
            rankSignalsModule = await WebAssembly.instantiate(
                await fetch('/wasm/rank_signals.wasm').then(r => r.arrayBuffer())
            );
            console.log('WASM modules loaded');
        }

        // engagement_rate: (impressions: number, engagements: number) => number
        function computeEngagementRateWasm(impressions, engagements) {
            if (engagementRateModule) {
                const rate = engagementRateModule.instance.exports.engagement_rate(
                    impressions, engagements
                );
                return rate;
            }
            return null;
        }

        // rank_signals: (signals: [{topic: string, source: string, relevance: number}]) => [{topic: string, source: string, relevance: number}]
        function computeRankSignalsWasm(signals) {
            if (rankSignalsModule) {
                const sorted = rankSignalsModule.instance.exports.rank_signals(
                    signals
                );
                return sorted;
            }
            return null;
        }

        async function computeEngagementRate() {
            const impressions = parseInt(document.getElementById('imp').value);
            const engagements = parseInt(document.getElementById('eng').value);
            
            // Try WASM first
            let rate = null;
            if (engagementRateModule) {
                rate = computeEngagementRateWasm(impressions, engagements);
            }
            
            // Fallback: fetch via API
            if (rate === null) {
                const response = await fetch(`/api/compute/engagement_rate?impressions=${impressions}&engagements=${engagements}`);
                const data = await response.json();
                rate = data.engagement_rate;
            }
            
            document.getElementById('rate-value').textContent = rate.toString();
        }

        async function computeRankSignals() {
            const signalsJson = document.getElementById('signals-json').value;
            const signals = JSON.parse(signalsJson);
            
            // Try WASM first
            let sorted = null;
            if (rankSignalsModule) {
                sorted = computeRankSignalsWasm(signals);
            }
            
            // Fallback: fetch via API
            if (sorted === null) {
                const response = await fetch('/api/compute/rank_signals', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({signals})
                });
                const data = await response.json();
                sorted = data.sorted;
            }
            
            document.getElementById('sorted-value').textContent = JSON.stringify(sorted);
        }

        // Initialize
        loadWasmModules().then(() => {
            console.log('WASM modules ready');
        });
    </script>
</body>
</html>
